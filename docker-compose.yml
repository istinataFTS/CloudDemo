services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: garage
      POSTGRES_USER: garage
      POSTGRES_PASSWORD: garage
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garage -d garage"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: "s3,sqs"
      DEBUG: "0"
      # LocalStack accepts any signature by default. Real S3 does not, and
      # the content type pinned into a presigned URL means nothing unless
      # the signature is checked.
      S3_SKIP_SIGNATURE_VALIDATION: "0"
      AWS_DEFAULT_REGION: "eu-central-1"
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  init:
    image: localstack/localstack:3
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      AWS_ENDPOINT_URL: "http://localstack:4566"
      LOCALSTACK_HOST: "localstack:4566"
      AWS_DEFAULT_REGION: "eu-central-1"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
    volumes:
      - ./localstack/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  web:
    build: .
    environment:
      ROLE: web
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=garage;Username=garage;Password=garage"
      AWS__Region: "eu-central-1"
      AWS__BucketName: "garage-local-media"
      AWS__QueueUrl: "http://localstack:4566/000000000000/garage-photos"
      AWS__ServiceUrl: "http://localstack:4566"
      AWS__PublicServiceUrl: "http://localhost:4566"
      AWS__ForcePathStyle: "true"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_REGION: "eu-central-1"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully

  worker:
    build: .
    environment:
      ROLE: worker
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Default: "Host=db;Port=5432;Database=garage;Username=garage;Password=garage"
      AWS__Region: "eu-central-1"
      AWS__BucketName: "garage-local-media"
      AWS__QueueUrl: "http://localstack:4566/000000000000/garage-photos"
      AWS__ServiceUrl: "http://localstack:4566"
      AWS__ForcePathStyle: "true"
      AWS_ACCESS_KEY_ID: "test"
      AWS_SECRET_ACCESS_KEY: "test"
      AWS_REGION: "eu-central-1"
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully

volumes:
  pgdata:
